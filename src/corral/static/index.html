<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corral</title>
<script>
  // Before the page draws, so a chosen theme never flashes the default one.
  (function () {
    var m = /[?&]theme=([a-z-]+)/.exec(location.hash), t = m && m[1];
    try { t = t || localStorage.getItem("corral-theme"); } catch (e) {}
    if (t && t !== "auto") document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* Themes: "auto" (no data-theme) follows the system; the others are picked
     in the header and remembered in this browser. Charts only use these. */
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --panel: #ffffff; --border: #d9dce1; --text: #1c1f24; --muted: #68707d;
    --accent: #2563eb; --selected: #e8effd; --log-bg: #ffffff; --on-accent: #ffffff;
    --green: #17803d; --amber: #b45309; --red: #c62828; --blue: #2563eb; --grey: #7b8492;
    --series-1: #2a78d6; --series-2: #eb6834; --grid: #e4e6ea; --axis: #c3c7ce;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1b998b; --c4: #c2408f;
    --c5: #9a7b0a; --c6: #7356d0; --c7: #3a8f3a; --c8: #8c5a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #14161a; --panel: #1c1f25; --border: #30353e; --text: #e3e6ea; --muted: #939ba8;
      --accent: #6ea0ff; --selected: #232c40; --log-bg: #101216; --on-accent: #0d1117;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171; --blue: #6ea0ff; --grey: #8a93a1;
      --series-1: #3987e5; --series-2: #d95926; --grid: #2a2e36; --axis: #3a404a;
      --c1: #4a90e8; --c2: #f07a48; --c3: #2bb3a3; --c4: #dd5aa6;
      --c5: #c9a227; --c6: #9a82ec; --c7: #55b055; --c8: #b07b5a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --bg: #14161a; --panel: #1c1f25; --border: #30353e; --text: #e3e6ea; --muted: #939ba8;
      --accent: #6ea0ff; --selected: #232c40; --log-bg: #101216; --on-accent: #0d1117;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171; --blue: #6ea0ff; --grey: #8a93a1;
      --series-1: #3987e5; --series-2: #d95926; --grid: #2a2e36; --axis: #3a404a;
      --c1: #4a90e8; --c2: #f07a48; --c3: #2bb3a3; --c4: #dd5aa6;
      --c5: #c9a227; --c6: #9a82ec; --c7: #55b055; --c8: #b07b5a;
  }
  :root[data-theme="solarized-light"] {
    color-scheme: light;
    --bg: #eee8d5; --panel: #fdf6e3; --border: #d6cfba; --text: #073642; --muted: #5f747b;
    --accent: #268bd2; --selected: #e6dfc8; --log-bg: #fdf6e3; --on-accent: #fdf6e3;
    --green: #6b7d00; --amber: #a07800; --red: #dc322f; --blue: #268bd2; --grey: #839496;
    --series-1: #268bd2; --series-2: #cb4b16; --grid: #e4ddc8; --axis: #c9c1aa;
    --c1: #268bd2; --c2: #cb4b16; --c3: #2aa198; --c4: #d33682;
    --c5: #b58900; --c6: #6c71c4; --c7: #859900; --c8: #8f5a3c;
  }
  :root[data-theme="solarized-dark"] {
    color-scheme: dark;
    --bg: #002b36; --panel: #073642; --border: #1a4b57; --text: #d5dcd8; --muted: #93a1a1;
    --accent: #3a9ee6; --selected: #0e4a58; --log-bg: #00252e; --on-accent: #002b36;
    --green: #9cb300; --amber: #d4a400; --red: #f0524e; --blue: #3a9ee6; --grey: #839496;
    --series-1: #3a9ee6; --series-2: #e0612a; --grid: #0f414e; --axis: #2a5966;
    --c1: #3a9ee6; --c2: #e0612a; --c3: #2fb5aa; --c4: #e2508f;
    --c5: #c99a00; --c6: #8a8fe0; --c7: #9cb300; --c8: #c08060;
  }
  :root[data-theme="nord"] {
    color-scheme: dark;
    --bg: #2e3440; --panel: #3b4252; --border: #4c566a; --text: #eceff4; --muted: #b0b9c9;
    --accent: #88c0d0; --selected: #434c5e; --log-bg: #2b303b; --on-accent: #2e3440;
    --green: #a3be8c; --amber: #ebcb8b; --red: #e08a92; --blue: #81a1c1; --grey: #8f99ad;
    --series-1: #88c0d0; --series-2: #d08770; --grid: #464f61; --axis: #586379;
    --c1: #88c0d0; --c2: #d08770; --c3: #a3be8c; --c4: #b48ead;
    --c5: #ebcb8b; --c6: #81a1c1; --c7: #8fbcbb; --c8: #c9a07e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
           padding: 2px 9px; cursor: pointer; }
  button { white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); flex: none; }
  header h1 { font-size: 15px; margin: 0; }
  header h1 a { color: inherit; }
  header nav { display: flex; gap: 4px; }
  header nav a { padding: 3px 10px; border-radius: 5px; color: var(--muted); }
  header nav a:hover { text-decoration: none; color: var(--text); }
  header nav a.active { color: var(--text); background: var(--selected); font-weight: 600; }
  #error { color: var(--red); }
  header .grow { flex: 1; }
  #theme { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px;
           color: var(--muted); font-size: 13px; }

  /* kiosk: only the panels, for a wall screen */
  body.kiosk header, body.kiosk .dashbar { display: none !important; }
  body.kiosk #dashboard { padding: 12px; }
  #kioskexit { position: fixed; top: 10px; right: 10px; z-index: 20; opacity: 0; transition: opacity .3s;
               box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  body.kiosk.awake #kioskexit { opacity: 1; }
  body.kiosk:not(.awake) { cursor: none; }

  /* state colours, shared by cards and the script header */
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grey); flex: none; }
  .state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--grey); }
  .s-running .dot { background: var(--green); } .s-running .state { color: var(--green); }
  .s-backoff .dot, .s-starting .dot, .s-stopping .dot { background: var(--amber); }
  .s-backoff .state, .s-starting .state, .s-stopping .state { color: var(--amber); }
  .detail { color: var(--muted); font-size: 12px; }
  .bad { color: var(--red); font-weight: 600; }
  .actions { display: flex; gap: 6px; }

  /* overview */
  #overview { overflow-y: auto; padding: 16px; flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 12px; }
  .apphead { display: flex; align-items: baseline; gap: 10px; margin: 18px 2px 8px; }
  .apphead:first-child { margin-top: 0; }
  .apphead h2 { font-size: 15px; margin: 0; }
  .apphead .detail { overflow-wrap: anywhere; }
  .command { font-size: 12px; color: var(--muted); padding: 4px 16px 0; overflow-wrap: anywhere; }
  #reloadmsg { color: var(--muted); font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; flex: 1; }
  .card .bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .empty { color: var(--muted); padding: 12px 4px; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tile .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .tile .value { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .tile .sub { color: var(--muted); font-size: 11px; min-height: 15px; }
  .sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .spark .head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
  .spark .max { font-variant-numeric: tabular-nums; }

  /* script page */
  #script { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .scripthead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px 0; }
  .scripthead h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
  .scripthead .grow { flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--border); }
  .tabs a { padding: 6px 14px; color: var(--muted); border: 1px solid transparent; border-bottom: 0;
            border-radius: 6px 6px 0 0; margin-bottom: -1px; }
  .tabs a:hover { text-decoration: none; color: var(--text); }
  .tabs a.active { color: var(--text); font-weight: 600; background: var(--bg);
                   border-color: var(--border); border-bottom: 1px solid var(--bg); }

  #logs { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; }
  #filter { flex: 1; min-width: 160px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 5px; padding: 4px 8px; }
  label { white-space: nowrap; user-select: none; }
  #log { flex: 1; overflow: auto; background: var(--log-bg); padding: 6px 0; font-size: 12.5px;
         border-top: 1px solid var(--border); }
  #older { margin: 2px 16px 8px; }
  .line { display: flex; gap: 10px; padding: 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line:hover { background: var(--selected); }
  .line .ts, .line .tag { color: var(--muted); flex: none; white-space: pre; }
  .line.stderr .tag, .line.stderr .txt { color: var(--red); }
  .line.runner .tag, .line.runner .txt { color: var(--blue); font-style: italic; }
  .line .txt { flex: 1; min-width: 0; }

  #monitor { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
  .ranges { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .ranges span { color: var(--muted); margin-right: 4px; }
  .ranges button.active { background: var(--selected); border-color: var(--accent); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .panel h3 { font-size: 13px; margin: 0 0 2px; }
  .panel .hint { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #montiles { margin-bottom: 12px; }
  #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--axis); stroke-width: 1; }
  .chart .cursor { stroke: var(--muted); stroke-width: 1; }
  .chart .nodata { fill: var(--muted); font-size: 12px; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
         border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; z-index: 2;
         box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
  .tip .when { color: var(--muted); }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; }
  th, td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td:last-child { white-space: normal; overflow-wrap: anywhere; }

  /* dashboards */
  #dashlist, #dashboard { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
  .dashbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
  .dashbar h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
  .dashbar .grow { flex: 1; }
  .dashbar .ranges { margin: 0; }
  #dashnameinput { font-size: 16px; font-weight: 600; min-width: 0; width: 260px; }
  input[type=text], input[type=number], input:not([type]), select {
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  #dashes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; }
  #dashes .card .name { flex: none; }

  .grid { position: relative; min-height: 120px; }
  .gpanel { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 12px 10px; display: flex; flex-direction: column; min-width: 0;
            transition: left .15s, top .15s, width .15s, height .15s; }
  .gpanel.dragging { transition: none; z-index: 5; opacity: .92; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
  .ghead { display: flex; align-items: center; gap: 8px; height: 22px; flex: none; margin-bottom: 4px; }
  .gtitle { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gtools { display: none; gap: 4px; }
  .gtools button { padding: 0 7px; font-size: 12px; }
  .grid.editing .gtools { display: flex; }
  .grid.editing { user-select: none; }
  .grid.editing .ghead { cursor: grab; touch-action: none; }
  .gbody { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .gbody .chart { flex: none; }
  .gbody .msg { color: var(--muted); font-size: 12px; margin: auto; text-align: center; padding: 8px; }
  .gbody .msg.bad { color: var(--red); font-weight: normal; }
  .rh { display: none; position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize;
        touch-action: none; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); border-radius: 0 0 5px 0; }
  .grid.editing .rh { display: block; }
  .ghost { position: absolute; border: 2px dashed var(--accent); border-radius: 8px; background: var(--selected); }
  .dlegend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted);
             max-height: 36px; overflow-y: auto; flex: none; margin-top: 4px; }
  .dlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .stat { display: flex; flex-direction: column; justify-content: center; flex: 1; min-height: 0; }
  .stat .big { font-size: 32px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 14px; overflow-y: auto; }
  .stats .big { font-size: 20px; }
  .stats .label, .stat .label { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { overflow-y: auto; display: grid; grid-template-columns: minmax(40px, max-content) 1fr auto; gap: 6px 10px;
          align-items: center; font-size: 12px; }
  .bars .label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .bars .track { height: 14px; }
  .bars .bar { height: 100%; background: var(--c1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .gbody .tablewrap { overflow: auto; }
  .heat rect.cell:hover { stroke: var(--text); stroke-width: 1; }

  dialog#editor { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
                  padding: 0; width: min(1040px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog#editor::backdrop { background: rgba(0, 0, 0, .4); }
  .edwrap { display: grid; grid-template-columns: 340px 1fr; gap: 18px; padding: 16px; }
  .edform { display: flex; flex-direction: column; gap: 10px; }
  .edform .row > span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .edform .row input:not([type=checkbox]), .edform .row select { width: 100%; }
  .edform .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edform .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .edform .checks label { font-size: 13px; }
  .edform .filters { display: grid; grid-template-columns: max-content 1fr; gap: 4px 8px; align-items: center; font-size: 13px; }
  .edform .info { color: var(--muted); font-size: 12px; min-height: 16px; overflow-wrap: anywhere; }
  .edpreview { display: flex; flex-direction: column; min-width: 0; }
  .edpreview .gpanel { position: relative; height: 320px; transition: none; }
  .edbuttons { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }

  @media (max-width: 760px) {
    .edwrap { grid-template-columns: 1fr; }
    .edpreview .gpanel { height: 240px; }
  }

  @media (max-width: 520px) {
    .cards, #charts { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1><a href="#/">corral</a></h1>
  <nav>
    <a href="#/" id="nav-scripts">Scripts</a>
    <a href="#/d" id="nav-dash">Dashboards</a>
  </nav>
  <span class="grow"></span>
  <span id="reloadmsg"></span>
  <button id="reload" title="Re-read the config file and the apps' Procfiles and .env files">Reload</button>
  <select id="theme" aria-label="Theme">
    <option value="auto">Theme: auto</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="solarized-light">Solarized light</option>
    <option value="solarized-dark">Solarized dark</option>
    <option value="nord">Nord</option>
  </select>
  <span id="error" hidden></span>
</header>

<section id="overview">
  <div id="cards"></div>
</section>

<section id="script" hidden>
  <div class="scripthead" id="scripthead">
    <a href="#/">← All scripts</a>
    <span class="dot"></span>
    <h2 id="title"></h2>
    <span class="state" id="headstate"></span>
    <span class="detail grow" id="headdetail"></span>
    <span class="actions" id="headactions"></span>
  </div>
  <div class="command mono" id="headcommand"></div>
  <nav class="tabs">
    <a id="tab-logs">Logs</a>
    <a id="tab-monitor">Monitoring</a>
  </nav>

  <div id="logs">
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter log lines…" autocomplete="off">
      <label><input type="checkbox" class="stream" value="stdout" checked> stdout</label>
      <label><input type="checkbox" class="stream" value="stderr" checked> stderr</label>
      <label><input type="checkbox" class="stream" value="runner" checked> runner</label>
      <label><input type="checkbox" id="follow" checked> Follow</label>
    </div>
    <div id="log" class="mono"><button id="older" hidden>Load older lines</button><div id="lines"></div></div>
  </div>

  <div id="monitor" hidden>
    <div class="ranges" id="ranges"><span>Range</span></div>
    <div class="panel tiles" id="montiles"></div>
    <div id="charts"></div>
    <div class="panel">
      <h3>Recent runs</h3>
      <div class="hint" id="runsummary"></div>
      <table>
        <thead><tr><th>Started</th><th>Duration</th><th>Result</th></tr></thead>
        <tbody id="runs"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="dashlist" hidden>
  <div class="dashbar">
    <h2>Dashboards</h2>
    <span class="grow"></span>
    <button id="newdash" class="primary">New dashboard</button>
  </div>
  <div id="dashes"></div>
</section>

<section id="dashboard" hidden>
  <div class="dashbar">
    <a href="#/d">← Dashboards</a>
    <h2 id="dashname"></h2>
    <input id="dashnameinput" type="text" maxlength="200" aria-label="Dashboard name" hidden>
    <span class="ranges" id="dashranges"></span>
    <span class="grow"></span>
    <span class="detail" id="dashstatus"></span>
    <button id="addpanel" hidden>Add panel</button>
    <button id="deldash" class="danger" hidden>Delete dashboard</button>
    <button id="kioskbtn" title="Full screen, panels only">Kiosk</button>
    <button id="editdash">Edit</button>
  </div>
  <button id="kioskexit" hidden>Exit kiosk</button>
  <div id="grid" class="grid"><div id="ghost" class="ghost" hidden></div></div>
</section>

<dialog id="editor">
  <form method="dialog" id="edform">
    <div class="edwrap">

            <option value="max">Maximum</option><option value="min">Minimum</option><option value="count">Count</option>

              <option value="none">Number</option><option value="percent">Percent</option>
              <option value="bytes">Bytes</option><option value="seconds">Seconds</option>
            </select></label>

            <select id="ed-reduce">
