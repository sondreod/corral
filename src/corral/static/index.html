<script>
"use strict";
const PAGE = 500, MAX_DOM_LINES = 20000;
const OVERVIEW_RANGE = 3600;
const GIB = 1073741824;
const RANGES = [["15 min", 900], ["1 h", 3600], ["6 h", 21600], ["24 h", 86400], ["7 d", 604800]];
const SVG_NS = "http://www.w3.org/2000/svg";

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const svg = (tag, attrs) => {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
};

let scripts = [];
let route = { view: "overview" };
let view = 0;          // bumped whenever the log view is reset; stale responses are dropped
let firstId = null, lastId = null, tailBusy = false, loaded = false;
let monitorRange = RANGES[0][1];
let monitorData = null;               // last metrics response shown on the Monitoring tab
const overviewData = new Map();       // script name -> last metrics response
const cards = new Map();              // script name -> card elements

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
const scriptUrl = (name, rest) => `/api/scripts/${encodeURIComponent(name)}/${rest}`;

function showError(err) {
  $("error").hidden = !err;
  $("error").textContent = err ? String(err.message || err) : "";
}

// ---- formatting --------------------------------------------------------

const pad = (n, w = 2) => String(n).padStart(w, "0");
function stamp(ts, millis = true) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
         (millis ? `.${pad(d.getMilliseconds(), 3)}` : "");
}
function clock(ts, withDay) {
  const d = new Date(ts * 1000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return withDay ? `${d.toLocaleDateString(undefined, { weekday: "short" })} ${hm}` : hm;
}
function ago(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  if (seconds < 60) return seconds + "s";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h " + Math.floor(seconds % 3600 / 60) + "m";
  return Math.floor(seconds / 86400) + "d " + Math.floor(seconds % 86400 / 3600) + "h";
}
const trim = (v, digits) => String(Number(v.toFixed(digits)));
const fmtCount = (v) => v == null ? "–" : trim(v, v < 10 ? 1 : 0);
const fmtCpu = (v) => v == null ? "–" : trim(v, v < 10 ? 1 : 0) + "%";
function fmtBytes(v) {
  if (v == null) return "–";
  const mb = v / 1048576;
  return mb >= 1024 ? trim(mb / 1024, 2) + " GB" : trim(mb, mb < 10 ? 1 : 0) + " MB";
}
const rangeLabel = (seconds) => (RANGES.find((r) => r[1] === seconds) || ["range"])[0];

// ---- script status -----------------------------------------------------

function describe(s, now) {
  const parts = [];
  if (s.pid) parts.push("pid " + s.pid);
  if (s.pid && s.started_at) parts.push("up " + ago(now - s.started_at));
  if (s.next_run) parts.push("restart in " + ago(s.next_run - now));
  let bad = null;
  if (!s.pid && s.exited_at) {
    const when = " " + ago(now - s.exited_at) + " ago";
    if (s.exit_code === 0) parts.push("exit 0" + when);
    else bad = (s.exit_code === null ? "failed to start" : s.exit_code < 0
      ? "killed (signal " + -s.exit_code + ")" : "exit " + s.exit_code) + when;
  }
  return [parts.join(" · "), bad];
}

function fillDetail(node, s, now) {
  const [text, bad] = describe(s, now);
  node.replaceChildren(text);
  if (bad) node.append(text ? " · " : "", el("span", "bad", bad));
}

function fillActions(node, s) {
  const key = String(s.enabled);
  if (node.dataset.key === key) return;   // keep buttons stable under the pointer
  node.dataset.key = key;
  node.replaceChildren();
  const button = (label, action) => {
    const b = el("button", "", label);
    b.onclick = async (ev) => {
      ev.stopPropagation();
      try {
        await api(scriptUrl(s.name, action), { method: "POST", headers: { "X-Corral": "1" } });
      } catch (err) { showError(err); }
      refreshScripts();
    };
    node.append(b);
  };
  if (s.enabled) button("Stop", "stop");
  else button("Start", "start");
  button("Restart", "restart");
}

function tile(label) {
  const box = el("div", "tile");
  const value = el("div", "value num", "–"), sub = el("div", "sub");
  box.append(el("div", "label", label), value, sub);
  return { box, value, sub };
}

function fillUsageTiles(t, s) {
  const u = s.usage;
  t.cpu.value.textContent = fmtCpu(u && u.cpu);
  t.mem.value.textContent = fmtBytes(u && u.rss);
  if (t.threads) t.threads.value.textContent = u ? String(u.threads) : "–";
  if (t.fds) t.fds.value.textContent = u ? String(u.fds) : "–";
}

function fillHistoryTiles(t, data, label) {
  const lines = data.points.reduce((a, p) => [a[0] + p.out_lines, a[1] + p.err_lines], [0, 0]);
  t.runs.value.textContent = String(data.runs.total);
  t.runs.sub.replaceChildren(data.runs.failed ? el("span", "bad", data.runs.failed + " failed") : "none failed");
  t.lines.value.textContent = String(lines[0] + lines[1]);
  t.lines.sub.textContent = lines[1] + " on stderr";
  t.runs.box.firstChild.textContent = `Runs · ${label}`;
  t.lines.box.firstChild.textContent = `Log lines · ${label}`;
}

// ---- overview ----------------------------------------------------------

function buildCard(s) {
  const card = el("div", "card");
  card.onclick = () => { location.hash = `#/s/${encodeURIComponent(s.name)}/monitor`; };
  const top = el("div", "top");
  const state = el("span", "state");
  const name = el("span", "name", s.process || s.name);
  name.title = s.command || "";
  top.append(el("span", "dot"), name, state);
  const tiles = el("div", "tiles");
  const t = { cpu: tile("CPU"), mem: tile("Memory"), runs: tile("Runs"), lines: tile("Log lines") };
  tiles.append(t.cpu.box, t.mem.box, t.runs.box, t.lines.box);
  const sparks = el("div", "sparks");
  const spark = (label) => {
    const box = el("div", "spark"), head = el("div", "head"), chart = el("div", "chart");
    const max = el("span", "max");  // the value at the top of the chart's scale
    head.append(el("span", "label", label), max);
    box.append(head, chart);
    sparks.append(box);
    return { chart, max };
  };
  const cpuSpark = spark("CPU, last hour"), memSpark = spark("Memory, last hour");
  const bottom = el("div", "bottom");
  const detail = el("div", "detail"), actions = el("div", "actions");
  bottom.append(detail, actions);
  card.append(top, tiles, sparks, bottom);
  return { card, state, t, cpuSpark, memSpark, detail, actions };
}

function renderOverview() {
  const now = Date.now() / 1000;
  const box = $("cards");
  const names = scripts.map((s) => s.name + "\t" + s.cwd).join("\n");
  if (box.dataset.names !== names) {
    box.dataset.names = names;
    cards.clear();
    box.replaceChildren();
    if (!scripts.length) box.append(el("div", "empty", "No apps configured."));
    // One section per app, in config order (the processes of an app are listed together).
    let grid = null, app = null;
    for (const s of scripts) {
      if (!grid || s.app !== app) {
        app = s.app;
        const head = el("div", "apphead");
        head.append(el("h2", "", app || "processes"), el("span", "detail mono", s.cwd || ""));
        grid = el("div", "cards");
        box.append(head, grid);
      }
      const c = buildCard(s);
      cards.set(s.name, c);
      grid.append(c.card);
    }
    refreshOverviewMetrics();
  }
  for (const s of scripts) {
    const c = cards.get(s.name);
    c.card.className = "card s-" + s.state;
    c.state.textContent = s.state;
    fillUsageTiles(c.t, s);
    fillDetail(c.detail, s, now);
    fillActions(c.actions, s);
  }
}

function drawOverviewCharts(name) {
  const c = cards.get(name), data = overviewData.get(name);
  if (!c || !data) return;
  fillHistoryTiles(c.t, data, rangeLabel(OVERVIEW_RANGE));
  const series = (key, scale = 1) =>
    [{ color: "var(--series-1)", values: data.points.map((p) => [p.t, p[key] == null ? null : p[key] / scale]) }];
  // One scale for all cards, so the charts can be compared between scripts.
  const top = (key, scale = 1) => niceMax(Math.max(0, ...[...overviewData.values()].flatMap(
    (d) => d.points.map((p) => p[key] || 0))) / scale);
  const cpuTop = top("cpu"), memTop = top("rss", GIB);
  c.cpuSpark.max.textContent = fmtCount(cpuTop) + "%";
  c.memSpark.max.textContent = +memTop.toPrecision(2) + " GB";
  drawChart(c.cpuSpark.chart, { ...data, series: series("cpu"), spark: true, top: cpuTop });
  drawChart(c.memSpark.chart, { ...data, series: series("rss", GIB), spark: true, top: memTop });
}

async function refreshOverviewMetrics() {
  if (route.view !== "overview") return;
  await Promise.all(scripts.map(async (s) => {
    try {
      overviewData.set(s.name, await api(scriptUrl(s.name, `metrics?range=${OVERVIEW_RANGE}&points=60`)));
    } catch (err) { /* the status poll reports connection problems */ }
  }));
  for (const name of [...overviewData.keys()]) if (!cards.has(name)) overviewData.delete(name);
  scripts.forEach((s) => drawOverviewCharts(s.name));  // all of them: the shared scale may have changed
}

// ---- charts ------------------------------------------------------------

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

// opts: series [{name, color, values: [[t, v|null], ...]}], since, now, bucket,
//       fmt (value -> text), spark (true: no axes, no hover), top (fixed top of the scale),
//       height (pixels)
function drawChart(box, opts) {
  const spark = !!opts.spark;
  const W = Math.max(box.clientWidth, 80), H = Math.max(opts.height || (spark ? 34 : 170), 30);
  const m = spark ? { l: 1, r: 1, t: 3, b: 2 } : { l: 52, r: 10, t: 8, b: 22 };
  const fmt = opts.fmt || fmtCount;
  const t0 = opts.since, t1 = Math.max(opts.now, t0 + 1), half = opts.bucket / 2;
  const all = opts.series.flatMap((s) => s.values.map((v) => v[1]).filter((v) => v != null));
  const top = opts.top || niceMax(Math.max(0, ...all));
  const low = Math.min(0, ...all), bottom = low < 0 ? -niceMax(-low) : 0;
  const x = (t) => m.l + (Math.min(t + half, t1) - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = (v) => H - m.b - (v - bottom) / (top - bottom) * (H - m.t - m.b);

  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  if (!spark) {
    const level = (frac) => bottom + (top - bottom) * frac;
    for (const frac of [0, 0.5, 1]) {
      if (level(frac) !== 0) {
        root.append(svg("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y(level(frac)), y2: y(level(frac)) }));
      }
      const label = svg("text", { x: m.l - 6, y: y(level(frac)) + 4, "text-anchor": "end" });
      label.textContent = fmt(level(frac));
      root.append(label);
    }
    const span = t1 - t0, ticks = W < 260 ? 2 : W < 420 ? 3 : 5;
    for (let i = 0; i <= ticks; i++) {
      const t = t0 + span * i / ticks;
      const label = svg("text", { x: m.l + (W - m.l - m.r) * i / ticks, y: H - 6,
                                  "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle" });
      label.textContent = clock(t, span > 86400);
      root.append(label);
    }
  }
  if (spark && opts.top) root.append(svg("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y(top), y2: y(top) }));
  root.append(svg("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: y(0), y2: y(0) }));

  for (const s of opts.series) {
    // Split into runs of consecutive steps; a missing step means "not running".
    const runs = [];
    let run = null, last = null;
    for (const [t, v] of s.values) {
      if (v == null) { run = null; continue; }
      if (!run || t - last > opts.bucket * 1.5) runs.push(run = []);
      run.push([x(t), y(v)]);
      last = t;
    }
    for (const pts of runs) {
      if (pts.length === 1) {
        root.append(svg("circle", { cx: pts[0][0], cy: pts[0][1], r: 1.5, fill: s.color }));
        continue;
      }
      const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
      if (opts.series.length === 1) {
        const area = `${line}L${pts[pts.length - 1][0].toFixed(1)} ${y(0)}L${pts[0][0].toFixed(1)} ${y(0)}Z`;
        root.append(svg("path", { d: area, fill: s.color, opacity: 0.12 }));
      }
      root.append(svg("path", { d: line, fill: "none", stroke: s.color, "stroke-width": spark ? 1.5 : 2,
                                "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
  }
  if (!all.length && !spark) {
    const none = svg("text", { class: "nodata", x: (m.l + W - m.r) / 2, y: (m.t + H - m.b) / 2, "text-anchor": "middle" });
    none.textContent = "No data in this range";
    root.append(none);
  }
  box.replaceChildren(root);
  if (spark || !all.length) return;

  // Hover: a cursor line snapped to the nearest step, and a tooltip with every series' value there.
  const cursor = svg("line", { class: "cursor", y1: m.t, y2: H - m.b, visibility: "hidden" });
  const marks = opts.series.map((s) => svg("circle", { r: 4, fill: s.color, stroke: "var(--panel)",
                                                        "stroke-width": 2, visibility: "hidden" }));
  const hit = svg("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" });
  root.append(cursor, ...marks, hit);
  const tip = el("div", "tip");
  tip.hidden = true;
  box.append(tip);
  const lookups = opts.series.map((s) => new Map(s.values));
  const hide = () => {
    tip.hidden = true;
    [cursor, ...marks].forEach((n) => n.setAttribute("visibility", "hidden"));
  };
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("pointermove", (ev) => {
    const rect = root.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width;
    const at = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0) - half;
    const t = Math.round(at / opts.bucket) * opts.bucket;
    const values = lookups.map((l) => l.get(t));
    if (values.every((v) => v == null)) return hide();
    cursor.setAttribute("x1", x(t));
    cursor.setAttribute("x2", x(t));
    cursor.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", "when", stamp(t, false).slice(5, opts.bucket < 60 ? 19 : 16)));
    opts.series.forEach((s, i) => {
      const shown = values[i] != null;
      marks[i].setAttribute("visibility", shown ? "visible" : "hidden");
      if (!shown) return;
      marks[i].setAttribute("cx", x(t));
      marks[i].setAttribute("cy", y(values[i]));
      const row = el("div", "num");
      if (opts.series.length > 1) {
        const swatch = el("i");
        swatch.style.background = s.color;
        row.append(swatch, s.name + " ");
      }
      row.append(el("b", "", fmt(values[i])));
      tip.append(row);
    });
    tip.hidden = false;
    const left = x(t) * rect.width / W;
    tip.style.left = (left > rect.width / 2 ? left - tip.offsetWidth - 10 : left + 10) + "px";
  });
}

// ---- monitoring tab ----------------------------------------------------

const CHARTS = [
  { title: "CPU", hint: "Percent of one core, whole process tree",
    fmt: fmtCpu, series: [["cpu", "CPU", 1]] },
  { title: "Memory", hint: "Resident memory, whole process tree",
    fmt: (v) => fmtBytes(v * 1048576), series: [["rss", "Memory", 1048576]] },
  { title: "Threads", hint: "Across all processes of the script", series: [["threads", "Threads", 1]] },
  { title: "Open files", hint: "File descriptors across all processes", series: [["fds", "Open files", 1]] },
  { title: "Log output", hint: "Lines per minute", perMinute: true,
    series: [["out_lines", "stdout", 1], ["err_lines", "stderr", 1]] },
];
const COLORS = ["var(--series-1)", "var(--series-2)"];
const monitorTiles = {};
const chartBoxes = [];

function buildMonitor() {
  for (const [label, seconds] of RANGES) {
    const b = el("button", "", label);
    b.dataset.range = seconds;
    b.onclick = () => { monitorRange = seconds; loadMonitor(); };
    $("ranges").append(b);
  }
  Object.assign(monitorTiles, {
    cpu: tile("CPU"), mem: tile("Memory"), threads: tile("Threads"), fds: tile("Open files"),
    runs: tile("Runs"), lines: tile("Log lines"),
  });
  $("montiles").style.gridTemplateColumns = "repeat(auto-fit, minmax(110px, 1fr))";
  $("montiles").append(...Object.values(monitorTiles).map((t) => t.box));
  for (const spec of CHARTS) {
    const panel = el("div", "panel"), box = el("div", "chart");
    panel.append(el("h3", "", spec.title), el("div", "hint", spec.hint));
    if (spec.series.length > 1) {
      const legend = el("div", "legend");
      spec.series.forEach(([, name], i) => {
        const item = el("span"), swatch = el("i");
        swatch.style.background = COLORS[i];
        item.append(swatch, name);
        legend.append(item);
      });
      panel.append(legend);
    }
    panel.append(box);
    $("charts").append(panel);
    chartBoxes.push(box);
  }
}

function drawMonitor() {
  const data = monitorData;
  if (!data || route.view !== "monitor") return;
  fillHistoryTiles(monitorTiles, data, rangeLabel(monitorRange));
  CHARTS.forEach((spec, i) => {
    const scale = spec.perMinute ? data.bucket / 60 : 1;
    drawChart(chartBoxes[i], {
      ...data, fmt: spec.fmt,
      series: spec.series.map(([key, name, div], n) => ({
        name, color: COLORS[n],
        values: data.points.map((p) => [p.t, p[key] == null ? null : p[key] / div / scale]),
      })),
    });
  });
}

function runResult(r) {
  if (r.ended == null) return ["running", ""];
  if (r.note === "stopped") return ["stopped on request", ""];
  if (r.note === "interrupted") return ["interrupted (corral stopped)", ""];
  if (r.exit_code == null) return ["could not start: " + (r.note || "unknown reason"), "bad"];
  if (r.exit_code === 0) return ["exit 0", ""];
  return [r.exit_code < 0 ? `killed (signal ${-r.exit_code})` : `exit ${r.exit_code}`, "bad"];
}

async function loadMonitor() {
  if (route.view !== "monitor") return;
  const name = route.name, range = monitorRange;
  document.querySelectorAll("#ranges button").forEach((b) =>
    b.classList.toggle("active", Number(b.dataset.range) === range));
  try {
    const [metrics, runs] = await Promise.all([
      api(scriptUrl(name, `metrics?range=${range}&points=180`)),
      api(scriptUrl(name, "runs?limit=30")),
    ]);
    if (route.view !== "monitor" || route.name !== name || monitorRange !== range) return;
    monitorData = metrics;
    drawMonitor();
    const now = Date.now() / 1000;
    $("runsummary").textContent = runs.runs.length ? "Newest first" : "No runs recorded yet";
    $("runs").replaceChildren(...runs.runs.map((r) => {
      const row = el("tr"), [text, cls] = runResult(r);
      row.append(el("td", "num", stamp(r.started, false)),
                 el("td", "num", ago((r.ended ?? now) - r.started)), el("td", cls, text));
      return row;
    }));
  } catch (err) { /* the status poll reports connection problems */ }
}

// ---- log tab -----------------------------------------------------------

function logUrl(extra) {
  const params = new URLSearchParams({ limit: PAGE, ...extra });
  const q = $("filter").value.trim();
  if (q) params.set("q", q);
  const streams = [...document.querySelectorAll(".stream")];
  if (!streams.every((c) => c.checked))
    params.set("streams", streams.filter((c) => c.checked).map((c) => c.value).join(","));
  return scriptUrl(route.name, `logs?${params}`);
}

function lineNode(l) {
  const row = el("div", "line " + l.stream);
  row.append(el("span", "ts", stamp(l.ts)), el("span", "tag", l.stream.padEnd(6)), el("span", "txt", l.line));
  return row;
}

async function resetLog() {
  const mine = ++view;
  loaded = false;
  firstId = lastId = null;
  $("lines").replaceChildren();
  $("older").hidden = true;
  if (route.view !== "logs") return;
  if (document.querySelectorAll(".stream:checked").length === 0) return;
  try {
    const { lines } = await api(logUrl({}));
    if (mine !== view) return;
    loaded = true;
    $("lines").append(...lines.map(lineNode));
    if (lines.length) { firstId = lines[0].id; lastId = lines[lines.length - 1].id; }
    $("older").hidden = lines.length < PAGE;
    $("log").scrollTop = $("log").scrollHeight;
  } catch (err) { showError(err); }
}

async function tail() {
  if (route.view !== "logs" || !loaded || tailBusy ||
      document.querySelectorAll(".stream:checked").length === 0) return;
  tailBusy = true;
  const mine = view;
  try {
    for (;;) {
      const { lines } = await api(logUrl({ after: lastId ?? 0 }));
      if (mine !== view) break;
      if (lines.length) {
        const box = $("lines");
        box.append(...lines.map(lineNode));
        lastId = lines[lines.length - 1].id;
        if (firstId === null) firstId = lines[0].id;
        if ($("follow").checked) {
          while (box.childElementCount > MAX_DOM_LINES) box.firstElementChild.remove();
          $("log").scrollTop = $("log").scrollHeight;
        }
      }
      if (lines.length < PAGE) break;
    }
  } catch (err) { /* the status poll reports connection problems */ }
  tailBusy = false;
}

$("older").onclick = async () => {
  if (firstId === null) return;
  const mine = view;
  try {
    const { lines } = await api(logUrl({ before: firstId }));
    if (mine !== view) return;
    const log = $("log"), heightBefore = log.scrollHeight;
    $("lines").prepend(...lines.map(lineNode));
    if (lines.length) firstId = lines[0].id;
    $("older").hidden = lines.length < PAGE;
    log.scrollTop += log.scrollHeight - heightBefore;  // keep the same lines in view
  } catch (err) { showError(err); }
};

let filterTimer;
$("filter").addEventListener("input", () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(resetLog, 250);
});
document.querySelectorAll(".stream").forEach((c) => c.addEventListener("change", resetLog));
$("follow").addEventListener("change", () => {
  if ($("follow").checked) $("log").scrollTop = $("log").scrollHeight;
});

// ---- dashboards --------------------------------------------------------

const DASH_RANGES = [...RANGES, ["30 d", 2592000]];
const GRID_COLS = 12, ROW_H = 30, GAP = 12, NARROW = 640;
const PALETTE = Array.from({ length: 8 }, (_, i) => `var(--c${i + 1})`);
const FN_LABELS = {
  raw: "Value", rate: "Rate per second", per_minute: "Rate per minute", increase: "Increase per step",
  quantile: "Quantile", heatmap: "Distribution",
};
const FNS_FOR = {
  counter: ["rate", "per_minute", "increase", "raw"],
  gauge: ["raw"],
  untyped: ["raw", "rate", "per_minute", "increase"],
  bucket: ["quantile", "rate", "per_minute", "increase", "raw"],
};

let catalog = null;          // {interval, metrics: Map name -> {name, kind, help, labels}}
let dash = null;             // the dashboard on screen: {id, name, spec: {range, panels}}
let dashEditing = false;
let dashTimer = null, saveTimer = null;
const panelViews = new Map();  // panel id -> {panel, node, title, body, data, error, seq}

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const jsonHeaders = { "Content-Type": "application/json", "X-Corral": "1" };

function fmtSI(v) {
  if (v == null) return "–";
  const a = Math.abs(v);
  for (const [div, suffix] of [[1e12, "T"], [1e9, "G"], [1e6, "M"], [1e3, "k"]]) {
    if (a >= div) return trim(v / div, a / div < 10 ? 2 : 1) + suffix;
  }
  if (a > 0 && a < 1) return String(+v.toPrecision(3));
  return trim(v, a < 10 ? 2 : 1);
}
function fmtSeconds(v) {
  if (v == null) return "–";
  const a = Math.abs(v);
  if (a === 0) return "0 s";
  if (a < 1e-3) return trim(v * 1e6, 0) + " µs";
  if (a < 1) return trim(v * 1000, a < 0.01 ? 2 : 0) + " ms";
  if (a < 120) return trim(v, a < 10 ? 2 : 1) + " s";
  if (a < 7200) return trim(v / 60, 1) + " min";
  return trim(v / 3600, 1) + " h";
}
function fmtBytesAny(v) {
  if (v == null) return "–";
  const a = Math.abs(v);
  for (const [div, suffix] of [[2 ** 40, "TB"], [2 ** 30, "GB"], [2 ** 20, "MB"], [2 ** 10, "KB"]]) {
    if (a >= div) return trim(v / div, a / div < 10 ? 2 : 1) + " " + suffix;
  }
  return trim(v, 0) + " B";
}
const unitFmt = (unit) => unit === "percent" ? (v) => v == null ? "–" : fmtSI(v) + "%"
  : unit === "bytes" ? fmtBytesAny : unit === "seconds" ? fmtSeconds : fmtSI;

// Names for a query's series: the labels that differ between them.
function seriesNames(series, fallback) {
  const keys = [...new Set(series.flatMap((s) => Object.keys(s.labels)))];
  const varying = keys.filter((k) => new Set(series.map((s) => s.labels[k] ?? "")).size > 1);
  return series.map((s) => {
    if (!varying.length) {
      const own = Object.entries(s.labels);
      return own.length ? own.map(([k, v]) => `${k}=${v}`).join(", ") : fallback;
    }
    return varying.map((k) => varying.length === 1 ? (s.labels[k] ?? "") : `${k}=${s.labels[k] ?? ""}`).join(", ");
  });
}
function reduceValues(values, how) {
  const vs = values.map((p) => p[1]).filter((v) => v != null);
  if (!vs.length) return null;
  if (how === "avg") return vs.reduce((a, b) => a + b, 0) / vs.length;
  if (how === "max") return Math.max(...vs);
  if (how === "min") return Math.min(...vs);
  return vs[vs.length - 1];
}

// ---- panel rendering ----

function message(body, text, bad) {
  body.replaceChildren(el("div", "msg" + (bad ? " bad" : ""), text));
}

function legendNode(names) {
  const legend = el("div", "dlegend");
  names.slice(0, PALETTE.length).forEach((name, i) => {
    const item = el("span"), swatch = el("i");
    swatch.style.background = PALETTE[i];
    item.append(swatch, name);
    legend.append(item);
  });
  if (names.length > PALETTE.length) legend.append(el("span", "", `+${names.length - PALETTE.length} more not drawn`));
  return legend;
}

function renderPanelBody(body, panel, data, error) {
  const q = panel.query || {};
  if (error) return message(body, error, true);
  if (!q.metric) return message(body, "Choose a metric for this panel.");
  if (!data) return message(body, "Loading…");
  if (!data.series.length) return message(body, "No data in this range");
  const fmt = unitFmt(panel.unit);
  const names = seriesNames(data.series, panel.title || q.metric);
  const reduce = panel.reduce || "last";
  body.replaceChildren();

  if (panel.type === "line") {
    const chart = el("div", "chart");
    body.append(chart);
    let legend = null;
    if (data.series.length > 1) body.append(legend = legendNode(names));
    const height = body.clientHeight - (legend ? legend.offsetHeight + 4 : 0);
    drawChart(chart, {
      since: data.start, now: data.end, bucket: data.step, fmt, height,
      series: data.series.slice(0, PALETTE.length).map((s, i) => ({ name: names[i], color: PALETTE[i], values: s.values })),
    });
  } else if (panel.type === "stat") {
    if (data.series.length === 1) {
      const box = el("div", "stat");
      box.append(el("div", "big", fmt(reduceValues(data.series[0].values, reduce))));
      if (Object.keys(data.series[0].labels).length) box.append(el("div", "label", names[0]));
      const spark = el("div", "chart");
      box.append(spark);
      body.append(box);
      const height = Math.min(60, body.clientHeight - box.offsetHeight);
      if (height >= 20) {
        drawChart(spark, { since: data.start, now: data.end, bucket: data.step, spark: true, height,
                           series: [{ color: PALETTE[0], values: data.series[0].values }] });
      }
    } else {
      const grid = el("div", "stats");
      data.series.forEach((s, i) => {
        const item = el("div", "stat");
        const label = el("div", "label", names[i]);
        label.title = names[i];
        item.append(label, el("div", "big", fmt(reduceValues(s.values, reduce))));
        grid.append(item);
      });
      body.append(grid);
    }
  } else if (panel.type === "bar") {
    const rows = data.series.map((s, i) => [names[i], reduceValues(s.values, reduce)])
      .sort((a, b) => (b[1] ?? -Infinity) - (a[1] ?? -Infinity));
    const max = Math.max(0, ...rows.map((r) => r[1] ?? 0)) || 1;
    const bars = el("div", "bars");
    for (const [name, v] of rows) {
      const label = el("span", "label", name), track = el("div", "track"), bar = el("div", "bar");
      label.title = name;
      bar.style.width = Math.max(0, (v ?? 0) / max * 100) + "%";
      track.append(bar);
      bars.append(label, track, el("span", "num", fmt(v)));
    }
    body.append(bars);
  } else if (panel.type === "table") {
    const keys = [...new Set(data.series.flatMap((s) => Object.keys(s.labels)))].sort();
    const table = el("table"), head = el("tr"), tbody = el("tbody");
    for (const k of keys) head.append(el("th", "", k));
    head.append(el("th", "", REDUCE_NAMES[reduce]));
    const thead = el("thead");
    thead.append(head);
    for (const s of data.series) {
      const row = el("tr");
      for (const k of keys) row.append(el("td", "", s.labels[k] ?? ""));
      row.append(el("td", "num", fmt(reduceValues(s.values, reduce))));
      tbody.append(row);
    }
    table.append(thead, tbody);
    const wrap = el("div", "tablewrap");
    wrap.append(table);
    body.append(wrap);
  } else if (panel.type === "heatmap") {
    const box = el("div", "chart");
    body.append(box);
    drawHeatmap(box, data, fmt, body.clientHeight);
  }
}
const REDUCE_NAMES = { last: "Latest", avg: "Average", max: "Maximum", min: "Minimum" };

// Histogram buckets over time: one row per bucket, darker for more observations.
function drawHeatmap(box, data, fmt, height) {
  const leOf = (s) => s.labels.le === "+Inf" ? Infinity : Number(s.labels.le);
  const rows = [...data.series].sort((a, b) => leOf(a) - leOf(b));
  const W = Math.max(box.clientWidth, 80), H = Math.max(height, 60);
  const m = { l: 60, r: 10, t: 6, b: 22 };
  const times = rows[0].values.map((p) => p[0]);
  const cw = (W - m.l - m.r) / times.length, ch = (H - m.t - m.b) / rows.length;
  const max = Math.max(0, ...rows.flatMap((r) => r.values.map((p) => p[1] ?? 0)));
  const gap = cw > 6 && ch > 6 ? 1 : 0;
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", class: "heat" });
  const bounds = (i) => {
    const hi = leOf(rows[i]), lo = i ? leOf(rows[i - 1]) : null;
    if (hi === Infinity) return "above " + fmt(lo ?? 0);
    return (lo == null ? "up to " : fmt(lo) + " – ") + fmt(hi);
  };
  rows.forEach((r, i) => {
    const y0 = H - m.b - (i + 1) * ch;
    r.values.forEach(([, v], j) => {
      if (!(v > 0)) return;
      const share = Math.round(15 + 85 * v / max);
      root.append(svg("rect", { class: "cell", x: m.l + j * cw, y: y0 + gap / 2, width: Math.max(cw - gap, 0.5),
                                height: Math.max(ch - gap, 0.5),
                                fill: `color-mix(in oklab, var(--c1) ${share}%, var(--panel))` }));
    });
  });
  // Bucket labels on the left, thinned out so they don't overlap.
  const every = Math.ceil(14 / ch);
  rows.forEach((r, i) => {
    if (i % every) return;
    const label = svg("text", { x: m.l - 6, y: H - m.b - (i + 0.5) * ch + 4, "text-anchor": "end" });
    label.textContent = leOf(r) === Infinity ? "+Inf" : "≤ " + fmt(leOf(r));
    root.append(label);
  });
  const t0 = data.start, span = data.end - t0, ticks = W < 260 ? 2 : W < 420 ? 3 : 5;
  for (let i = 0; i <= ticks; i++) {
    const label = svg("text", { x: m.l + (W - m.l - m.r) * i / ticks, y: H - 6,
                                "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle" });
    label.textContent = clock(t0 + span * i / ticks, span > 86400);
    root.append(label);
  }
  const hit = svg("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" });
  root.append(hit);
  box.replaceChildren(root);
  const tip = el("div", "tip");
  tip.hidden = true;
  box.append(tip);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; });
  hit.addEventListener("pointermove", (ev) => {
    const rect = root.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width, py = (ev.clientY - rect.top) * H / rect.height;
    const j = clamp(Math.floor((px - m.l) / cw), 0, times.length - 1);
    const i = clamp(Math.floor((H - m.b - py) / ch), 0, rows.length - 1);
    const v = rows[i].values[j][1];
    tip.replaceChildren(el("div", "when", stamp(times[j], false).slice(5, 16)), el("div", "", bounds(i)),
                        el("div", "num", (v == null ? "no data" : fmtSI(v) + " observations")));
    tip.hidden = false;
    const left = px * rect.width / W;
    tip.style.left = (left > rect.width / 2 ? left - tip.offsetWidth - 10 : left + 10) + "px";
    tip.style.top = Math.max(0, py * rect.height / H - 30) + "px";
  });
}

function queryUrl(query, range, width) {
  const points = clamp(Math.round(width / 3), 20, 600);
  return "/api/tsdb/query?" + new URLSearchParams({ q: JSON.stringify(query), range, points });
}

async function loadPanel(view) {
  const p = view.panel, mine = ++view.seq;
  if (!p.query || !p.query.metric) {
    view.data = null;
    view.error = null;
    return renderPanel(view);
  }
  try {
    const data = await api(queryUrl(p.query, dash.spec.range, view.body.clientWidth));
    if (mine !== view.seq) return;
    view.data = data;
    view.error = null;
  } catch (err) {
    if (mine !== view.seq) return;
    view.data = null;
    view.error = err.message || String(err);
  }
  renderPanel(view);
}

function renderPanel(view) {
  view.title.textContent = view.panel.title || (view.panel.query && view.panel.query.metric) || "Untitled";
  renderPanelBody(view.body, view.panel, view.data, view.error);
}

// ---- grid layout ----

const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// Place items top to bottom, each as high as it fits; `fixed` items stay put.
function pack(items, fixed = []) {
  const placed = fixed.map((p) => ({ ...p }));
  for (const it of [...items].sort((a, b) => a.y - b.y || a.x - b.x)) {
    const p = { ...it, y: 0 };
    for (let hits; (hits = placed.filter((q) => overlap(p, q))).length;) p.y = Math.min(...hits.map((q) => q.y + q.h));
    placed.push(p);
  }
  return new Map(placed.map((p) => [p.id, p]));
}

// The layout with `moving` dropped where it is: the others make room, then
// everything floats up.
function layoutWith(panels, moving) {
  const first = pack(panels.filter((p) => p.id !== moving.id), [moving]);
  return pack([...first.values()]);
}

function gridGeometry() {
  const W = $("grid").clientWidth;
  return { W, narrow: W < NARROW, colW: (W - GAP * (GRID_COLS - 1)) / GRID_COLS };
}
function boxOf(p, g) {
  return { left: p.x * (g.colW + GAP), top: p.y * (ROW_H + GAP),
           width: p.w * g.colW + (p.w - 1) * GAP, height: p.h * ROW_H + (p.h - 1) * GAP };
}

// Position every panel; `positions` overrides the saved ones while dragging,
// and the panel `ghostId` is shown as a drop target instead.
function placePanels(positions, ghostId, again = true) {
  const g = gridGeometry();
  let layout;
  if (g.narrow) {  // one column, in reading order
    let y = 0;
    layout = new Map([...dash.spec.panels].sort((a, b) => a.y - b.y || a.x - b.x)
      .map((p) => { const at = { ...p, x: 0, w: GRID_COLS, y }; y += p.h; return [p.id, at]; }));
  } else layout = positions || new Map(dash.spec.panels.map((p) => [p.id, p]));
  let bottom = 0;
  for (const [id, p] of layout) {
    const b = boxOf(p, g);
    bottom = Math.max(bottom, b.top + b.height);
    const target = id === ghostId ? $("ghost") : panelViews.get(id) && panelViews.get(id).node;
    if (!target) continue;
    Object.assign(target.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
  }
  $("grid").style.height = Math.max(bottom, 120) + "px";
  // The new height may have added or removed the page's scrollbar, and so
  // changed the width everything was placed for.
  if (again && $("grid").clientWidth !== g.W) placePanels(positions, ghostId, false);
}

function startDrag(ev, view, mode) {
  if (!dashEditing || gridGeometry().narrow || ev.button !== 0) return;
  if (mode === "move" && ev.target.closest("button")) return;
  ev.preventDefault();
  const panel = view.panel, g = gridGeometry(), start = boxOf(panel, g);
  const sx = ev.clientX, sy = ev.clientY, node = view.node;
  const target = { ...panel };
  let result = null;
  node.classList.add("dragging");
  $("ghost").hidden = false;
  placePanels(null, null);
  const move = (e) => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === "move") {
      node.style.left = start.left + dx + "px";
      node.style.top = start.top + dy + "px";
      target.x = clamp(Math.round((start.left + dx) / (g.colW + GAP)), 0, GRID_COLS - panel.w);
      target.y = Math.max(0, Math.round((start.top + dy) / (ROW_H + GAP)));
    } else {
      node.style.width = Math.max(g.colW, start.width + dx) + "px";
      node.style.height = Math.max(2 * ROW_H, start.height + dy) + "px";
      target.w = clamp(Math.round((start.width + dx + GAP) / (g.colW + GAP)), 1, GRID_COLS - panel.x);
      target.h = clamp(Math.round((start.height + dy + GAP) / (ROW_H + GAP)), 2, 40);
    }
    result = layoutWith(dash.spec.panels, target);
    const keep = { left: node.style.left, top: node.style.top, width: node.style.width, height: node.style.height };
    placePanels(result, panel.id);
    Object.assign(node.style, keep);  // the dragged panel follows the pointer, not the grid
  };
  const end = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
    node.classList.remove("dragging");
    $("ghost").hidden = true;
    if (result) {
      const resized = result.get(panel.id).w !== panel.w || result.get(panel.id).h !== panel.h;
      for (const p of dash.spec.panels) {
        const at = result.get(p.id);
        Object.assign(p, { x: at.x, y: at.y, w: at.w, h: at.h });
      }
      saveDashboard();
      placePanels();
      if (resized) setTimeout(() => loadPanel(view), 160);  // after the size transition
    } else placePanels();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
}

function buildPanel(panel) {
  const node = el("div", "gpanel"), head = el("div", "ghead"), title = el("span", "gtitle");
  const tools = el("span", "gtools"), body = el("div", "gbody"), handle = el("div", "rh");
  const view = { panel, node, title, body, data: null, error: null, seq: 0 };
  const tool = (label, fn) => {
    const b = el("button", "", label);
    b.type = "button";
    b.onclick = (e) => { e.stopPropagation(); fn(); };
    tools.append(b);
  };
  tool("Edit", () => openEditor(view.panel, false));
  tool("Copy", () => {
    const copy = { ...structuredClone(view.panel), id: newId(), y: view.panel.y + view.panel.h };
    dash.spec.panels.push(copy);
    dash.spec.panels = repack(dash.spec.panels, copy);
    syncPanels();
    saveDashboard();
  });
  tool("Remove", () => {
    if (!confirm(`Remove the panel "${title.textContent}"?`)) return;
    dash.spec.panels = dash.spec.panels.filter((p) => p.id !== view.panel.id);
    dash.spec.panels = [...pack(dash.spec.panels).values()];
    syncPanels();
    saveDashboard();
  });
  head.append(title, tools);
  head.addEventListener("pointerdown", (e) => startDrag(e, view, "move"));
  handle.addEventListener("pointerdown", (e) => startDrag(e, view, "resize"));
  node.append(head, body, handle);
  return view;
}

function repack(panels, moving) {
  return [...layoutWith(panels, moving).values()];
}

// Make the panel nodes match dash.spec.panels, then lay them out and load them.
function syncPanels() {
  const grid = $("grid"), wanted = new Set(dash.spec.panels.map((p) => p.id));
  for (const [id, view] of panelViews) {
    if (!wanted.has(id)) { view.node.remove(); panelViews.delete(id); }
  }
  for (const p of dash.spec.panels) {
    let view = panelViews.get(p.id);
    if (!view) {
      view = buildPanel(p);
      panelViews.set(p.id, view);
      grid.append(view.node);
    }
    view.panel = p;
  }
  if (!dash.spec.panels.length) {
    grid.querySelectorAll(".msg").forEach((n) => n.remove());
    grid.append(el("div", "msg empty", dashEditing ? "Add a panel to get started."
      : "This dashboard has no panels yet. Press Edit to add some."));
  } else grid.querySelectorAll(":scope > .msg").forEach((n) => n.remove());
  placePanels();
  for (const view of panelViews.values()) loadPanel(view);
}

function refreshPanels() {
  if (route.view !== "dashboard" || !dash) return;
  for (const view of panelViews.values()) loadPanel(view);
}

function redrawPanels() {
  if (route.view !== "dashboard" || !dash) return;
  placePanels();
  for (const view of panelViews.values()) renderPanel(view);
}

// ---- the dashboard page ----

function setEditing(on) {
  dashEditing = on;
  $("grid").classList.toggle("editing", on);
  $("editdash").textContent = on ? "Done" : "Edit";
  $("editdash").classList.toggle("primary", on);
  $("addpanel").hidden = $("deldash").hidden = !on;
  $("dashname").hidden = on;
  $("dashnameinput").hidden = !on;
  $("dashnameinput").value = dash ? dash.name : "";
  if (dash) syncPanels();
}

function showRanges() {
  document.querySelectorAll("#dashranges button").forEach((b) =>
    b.classList.toggle("active", dash && Number(b.dataset.range) === dash.spec.range));
}

async function openDashboard(id) {
  for (const view of panelViews.values()) view.node.remove();
  panelViews.clear();
  $("grid").querySelectorAll(":scope > .msg").forEach((n) => n.remove());
  dash = null;
  $("dashname").textContent = "";
  $("dashstatus").textContent = "";
  try {
    const loaded = await api(`/api/dashboards/${id}`);
    if (route.view !== "dashboard" || route.id !== id) return;
    dash = loaded;
    dash.spec.panels = dash.spec.panels || [];
    dash.spec.range = dash.spec.range || 21600;
  } catch (err) {
    showError(err);
    location.hash = "#/d";
    return;
  }
  $("dashname").textContent = dash.name;
  document.title = dash.name + " · corral";
  showRanges();
  setEditing(dashEditing && route.id === id);
  scheduleDashRefresh();
}

function scheduleDashRefresh() {
  clearTimeout(dashTimer);
  const every = clamp((catalog ? catalog.interval : 60) / 2, 5, 60) * 1000;
  dashTimer = setTimeout(() => { refreshPanels(); scheduleDashRefresh(); }, every);
}

function saveDashboard() {
  if (!dash) return;
  $("dashstatus").textContent = "Saving…";
  clearTimeout(saveTimer);
  const id = dash.id;
  saveTimer = setTimeout(async () => {
    try {
      const body = JSON.stringify({ name: dash.name, spec: dash.spec });
      await api(`/api/dashboards/${id}`, { method: "PUT", headers: jsonHeaders, body });
      if (dash && dash.id === id) $("dashstatus").textContent = "Saved";
    } catch (err) {
      $("dashstatus").textContent = "";
      showError("Could not save the dashboard: " + (err.message || err));
    }
  }, 300);
}

async function loadDashList() {
  try {
    const { dashboards } = await api("/api/dashboards");
    if (route.view !== "dashlist") return;
    const now = Date.now() / 1000;
    $("dashes").replaceChildren(...dashboards.map((d) => {
      const card = el("a", "card");
      card.href = `#/d/${d.id}`;
      card.style.color = "inherit";
      card.style.textDecoration = "none";
      card.append(el("div", "name", d.name),
                  el("div", "detail", `${d.panels} panel${d.panels === 1 ? "" : "s"} · changed ${ago(now - d.updated)} ago`));
      return card;
    }));
    if (!dashboards.length) $("dashes").append(el("div", "empty", "No dashboards yet."));
  } catch (err) { showError(err); }
}

$("newdash").onclick = async () => {
  const name = prompt("Name of the new dashboard", "New dashboard");
  if (!name || !name.trim()) return;
  try {
    const d = await api("/api/dashboards", { method: "POST", headers: jsonHeaders,
                                             body: JSON.stringify({ name, spec: { range: 21600, panels: [] } }) });
    dashEditing = true;
    location.hash = `#/d/${d.id}`;
  } catch (err) { showError(err); }
};
$("editdash").onclick = () => setEditing(!dashEditing);
$("dashnameinput").addEventListener("input", () => {
  const name = $("dashnameinput").value.trim();
  if (!dash || !name) return;
  dash.name = name;
  $("dashname").textContent = name;
  document.title = name + " · corral";
  saveDashboard();
});
$("deldash").onclick = async () => {
  if (!dash || !confirm(`Delete the dashboard "${dash.name}"? This cannot be undone.`)) return;
  try {
    await api(`/api/dashboards/${dash.id}`, { method: "DELETE", headers: jsonHeaders });
    dashEditing = false;
    location.hash = "#/d";
  } catch (err) { showError(err); }
};
$("addpanel").onclick = () => {
  const bottom = Math.max(0, ...dash.spec.panels.map((p) => p.y + p.h));
  openEditor({ id: newId(), type: "line", title: "", x: 0, y: bottom, w: 6, h: 8, unit: "none", reduce: "last",
               query: { metric: "", match: {}, fn: "raw", agg: "none", by: [], q: 0.95 } }, true);
};
for (const [label, seconds] of DASH_RANGES) {
  const b = el("button", "", label);
  b.dataset.range = seconds;
  b.onclick = () => {
    if (!dash) return;
    dash.spec.range = seconds;
    showRanges();
    refreshPanels();
    if (dashEditing) saveDashboard();
  };
  $("dashranges").append(b);
}

// ---- panel editor ----

let editing = null;   // {panel, isNew}
let previewTimer = null;
const editorPreview = { panel: null, node: null, title: $("ed-ptitle"), body: $("ed-preview"), data: null, error: null, seq: 0 };

async function loadCatalog() {
  const c = await api("/api/tsdb/metrics");
  catalog = { interval: c.interval, metrics: new Map(c.metrics.map((m) => [m.name, m])) };
  $("ed-metrics").replaceChildren(...c.metrics.map((m) => {
    const o = el("option");
    o.value = m.name;
    o.label = m.help ? `${m.kind} · ${m.help}` : m.kind;
    return o;
  }));
}

async function openEditor(panel, isNew) {
  try { await loadCatalog(); } catch (err) { return showError(err); }
  editing = { panel: structuredClone(panel), isNew };
  const p = editing.panel;
  // Fill in what a panel saved by hand or by an older version may leave out.
  const q = p.query = { metric: "", match: {}, fn: "raw", agg: "none", by: [], q: 0.95, ...(p.query || {}) };
  $("ed-title").value = p.title || "";
  $("ed-type").value = p.type;
  $("ed-metric").value = q.metric || "";
  $("ed-q").value = q.q ?? 0.95;
  $("ed-agg").value = q.agg || "none";
  $("ed-unit").value = p.unit || "none";
  $("ed-reduce").value = p.reduce || "last";
  $("ed-filters").dataset.metric = "";
  $("ed-fn").dataset.options = "";
  $("ed-fn").replaceChildren();
  $("editor").returnValue = "";
  syncEditor();
  $("editor").showModal();
}

function editorMetric() {
  return catalog && catalog.metrics.get($("ed-metric").value.trim());
}

// Read the form into editing.panel and show only the fields that apply.
function syncEditor() {
  const p = editing.panel, metric = editorMetric(), type = $("ed-type").value;
  const kind = metric ? metric.kind : null;
  $("ed-info").textContent = !$("ed-metric").value.trim() ? "" : metric
    ? `${kind === "bucket" ? "histogram buckets" : kind}${metric.help ? " · " + metric.help : ""}`
    : "No stored metric has this name (yet).";

  // label filters, rebuilt when the metric changes
  const keys = metric ? Object.keys(metric.labels).filter((k) => !(kind === "bucket" && k === "le")) : [];
  const filters = $("ed-filters");
  if (filters.dataset.metric !== (metric ? metric.name : "")) {
    filters.dataset.metric = metric ? metric.name : "";
    filters.replaceChildren();
    for (const k of keys) {
      const select = el("select");
      select.dataset.label = k;
      select.append(new Option("any", ""));
      for (const v of metric.labels[k]) select.append(new Option(v, v));
      select.value = metric.labels[k].includes(p.query.match[k]) ? p.query.match[k] : "";
      select.onchange = syncEditor;
      filters.append(el("span", "", k), select);
    }
    const by = $("ed-by");
    by.replaceChildren();
    for (const k of keys) {
      const box = el("input");
      box.type = "checkbox";
      box.value = k;
      box.checked = (p.query.by || []).includes(k);
      box.onchange = syncEditor;
      const label = el("label");
      label.append(box, " " + k);
      by.append(label);
    }
  }
  $("row-filters").hidden = !keys.length;

  // functions that make sense for this metric and panel type
  const fns = type === "heatmap" ? (kind === "bucket" ? ["heatmap"] : [])
    : kind ? FNS_FOR[kind] || ["raw"] : ["raw"];
  const fnSelect = $("ed-fn"), wantedFn = fnSelect.value || p.query.fn;
  if (fnSelect.dataset.options !== fns.join()) {
    fnSelect.dataset.options = fns.join();
    fnSelect.replaceChildren(...fns.map((f) => new Option(FN_LABELS[f], f)));
    fnSelect.value = fns.includes(p.query.fn) ? p.query.fn : fns[0] || "";
  } else if (fns.includes(wantedFn)) fnSelect.value = wantedFn;
  const fn = fnSelect.value;
  $("row-q").hidden = fn !== "quantile";
  $("row-agg").hidden = fn === "quantile" || fn === "heatmap";
  const agg = $("row-agg").hidden ? "none" : $("ed-agg").value;
  $("row-by").hidden = !keys.length || !(fn === "quantile" || agg !== "none");
  $("row-reduce").hidden = !["stat", "bar", "table"].includes(type);

  p.title = $("ed-title").value.trim();
  p.type = type;
  p.unit = $("ed-unit").value;
  p.reduce = $("ed-reduce").value;
  const match = {};
  filters.querySelectorAll("select").forEach((s) => { if (s.value) match[s.dataset.label] = s.value; });
  const q = Number($("ed-q").value);
  p.query = {
    metric: $("ed-metric").value.trim(), match, fn: fn || "raw", agg,
    by: $("row-by").hidden ? [] : [...$("ed-by").querySelectorAll("input:checked")].map((c) => c.value),
    q: Number.isFinite(q) ? clamp(q, 0, 1) : 0.95,
  };
  const problem = type === "heatmap" && metric && kind !== "bucket"
    ? "A heatmap needs a histogram's _bucket metric." : null;
  $("ed-save").disabled = !!problem;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => previewPanel(problem), 250);
}

async function previewPanel(problem) {
  const view = editorPreview;
  view.panel = editing.panel;
  view.data = null;
  view.error = problem;
  if (problem || !view.panel.query.metric) return renderPanel(view);
  const mine = ++view.seq;
  renderPanel(view);
  try {
    const data = await api(queryUrl(view.panel.query, dash.spec.range, view.body.clientWidth));
    if (mine !== view.seq) return;
    view.data = data;
  } catch (err) {
    if (mine !== view.seq) return;
    view.error = err.message || String(err);
  }
  renderPanel(view);
}

$("ed-cancel").onclick = () => $("editor").close("cancel");
for (const id of ["ed-title", "ed-metric", "ed-q"]) $(id).addEventListener("input", syncEditor);
for (const id of ["ed-type", "ed-fn", "ed-agg", "ed-unit", "ed-reduce"]) $(id).addEventListener("change", syncEditor);
$("editor").addEventListener("close", () => {
  clearTimeout(previewTimer);
  editorPreview.seq++;
  if ($("editor").returnValue !== "save" || !editing || !dash) return;
  syncEditor();
  clearTimeout(previewTimer);
  const p = editing.panel;
  if (editing.isNew) dash.spec.panels = repack([...dash.spec.panels, p], p);
  else dash.spec.panels = dash.spec.panels.map((x) => x.id === p.id ? p : x);
  const old = panelViews.get(p.id);
  if (old) old.data = null;
  editing = null;
  syncPanels();
  saveDashboard();
});

// ---- themes and kiosk --------------------------------------------------

const THEMES = ["auto", "light", "dark", "solarized-light", "solarized-dark", "nord"];

function savedTheme() {
  try { return localStorage.getItem("corral-theme") || "auto"; } catch (err) { return "auto"; }
}

// A theme in the link (?theme=nord, for kiosk screens) wins over the saved one.
function applyTheme() {
  const linked = route.theme && THEMES.includes(route.theme) ? route.theme : null;
  const theme = linked || savedTheme();
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  $("theme").value = theme;
}

$("theme").addEventListener("change", () => {
  try { localStorage.setItem("corral-theme", $("theme").value); } catch (err) { /* not remembered, still applied */ }
  if (route.theme) {  // drop the link's theme, or it would keep overriding the choice
    location.hash = location.hash.replace(/([?&])theme=[^&]*&?/, "$1").replace(/[?&]$/, "");
  }
  route.theme = null;
  applyTheme();
});

let kioskIdle = null;
let kioskFullscreen = false;   // whether kiosk mode asked for full screen (so leaving it leaves kiosk)

function wakeKiosk() {
  document.body.classList.add("awake");
  clearTimeout(kioskIdle);
  kioskIdle = setTimeout(() => document.body.classList.remove("awake"), 2500);
}

function setKiosk(on) {
  const was = document.body.classList.contains("kiosk");
  document.body.classList.toggle("kiosk", on);
  $("kioskexit").hidden = !on;
  if (on && dashEditing) setEditing(false);
  if (on && !was) wakeKiosk();
  if (!on && was && document.fullscreenElement) {
    kioskFullscreen = false;
    document.exitFullscreen().catch(() => {});
  }
}

function leaveKiosk() {
  if (route.view === "dashboard") location.hash = `#/d/${route.id}`;
}

$("kioskbtn").onclick = () => {
  if (!dash) return;
  const theme = route.theme ? `&theme=${route.theme}` : "";
  location.hash = `#/d/${dash.id}?kiosk${theme}`;
  // Must be asked for in the click itself; a bookmarked kiosk link shows the
  // panels without full screen (use the browser's own kiosk mode for that).
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen()
      .then(() => { kioskFullscreen = true; })
      .catch(() => {});
  }
};
$("kioskexit").onclick = leaveKiosk;
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && kioskFullscreen) {  // Esc in full screen
    kioskFullscreen = false;
    leaveKiosk();
  }
  setTimeout(redrawPanels, 100);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && document.body.classList.contains("kiosk") && !document.fullscreenElement) leaveKiosk();
});
for (const type of ["pointermove", "pointerdown", "keydown"]) {
  document.addEventListener(type, () => { if (document.body.classList.contains("kiosk")) wakeKiosk(); });
}

// ---- reloading the configuration ----

let reloadTimer = null;
$("reload").onclick = async () => {
  $("reload").disabled = true;
  try {
    const r = await api("/api/reload", { method: "POST", headers: { "X-Corral": "1" } });
    const parts = ["added", "changed", "removed"].filter((k) => r[k].length).map((k) => `${k} ${r[k].join(", ")}`);
    let text = parts.length ? "Reloaded: " + parts.join("; ") : "Reloaded: nothing changed";
    if (r.needs_restart.length) text += ` (restart corral to apply ${r.needs_restart.join(", ")})`;
    $("reloadmsg").textContent = text;
    showError(null);
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => { $("reloadmsg").textContent = ""; }, 8000);
    refreshScripts();
  } catch (err) {
    $("reloadmsg").textContent = "";
    showError("Reload failed, nothing was changed: " + (err.message || err));
  } finally {
    $("reload").disabled = false;
  }
};

// ---- routing and refresh -----------------------------------------------

// "#/" is the overview; "#/s/<name>/logs" and "#/s/<name>/monitor" are a script's tabs;
// "#/d" lists the dashboards and "#/d/<id>" shows one.
function parseRoute() {
  const [path, query] = location.hash.replace(/^#\/?/, "").split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").map(decodeURIComponent);
  if (parts[0] === "d" && /^\d+$/.test(parts[1] || "")) {
    return { view: "dashboard", id: Number(parts[1]), kiosk: params.has("kiosk"), theme: params.get("theme") };
  }
  if (parts[0] === "s" && parts[1]) return { view: parts[2] === "monitor" ? "monitor" : "logs", name: parts[1] };
  if (parts[0] === "d") return { view: "dashlist" };
  return { view: "overview" };
}

function renderScriptHead() {
  const s = scripts.find((x) => x.name === route.name);
  $("title").textContent = route.name;
  if (!s) return;
  $("scripthead").className = "scripthead s-" + s.state;
  $("headstate").textContent = s.state;
  $("headcommand").textContent = s.command ? "$ " + s.command : "";
  fillDetail($("headdetail"), s, Date.now() / 1000);
  fillActions($("headactions"), s);
  fillUsageTiles(monitorTiles, s);
}

function applyRoute() {
  const before = route;
  route = parseRoute();
  const onScript = route.view === "logs" || route.view === "monitor";
  const onDash = route.view === "dashlist" || route.view === "dashboard";
  $("overview").hidden = route.view !== "overview";
  $("script").hidden = !onScript;
  $("dashlist").hidden = route.view !== "dashlist";
  $("dashboard").hidden = route.view !== "dashboard";
  $("nav-scripts").classList.toggle("active", !onDash);
  $("nav-dash").classList.toggle("active", onDash);
  document.title = route.view === "dashboard" && dash && dash.id === route.id ? dash.name + " · corral" : "corral";
  applyTheme();
  setKiosk(route.view === "dashboard" && route.kiosk);
  if (route.view !== "dashboard") {
    clearTimeout(dashTimer);
    if (before.view === "dashboard") dashEditing = false;
  }
  if (route.view === "dashlist") return loadDashList();
  if (route.view === "dashboard") {
    if (before.view !== "dashboard" || before.id !== route.id) openDashboard(route.id);
    else if (before.kiosk !== route.kiosk) requestAnimationFrame(refreshPanels);  // the panels changed size
    return;
  }
  if (!onScript) {
    renderOverview();
    refreshOverviewMetrics();
    scripts.forEach((s) => drawOverviewCharts(s.name));  // widths may have changed while hidden
    return;
  }
  const base = `#/s/${encodeURIComponent(route.name)}/`;
  $("tab-logs").href = base + "logs";
  $("tab-monitor").href = base + "monitor";
  $("tab-logs").classList.toggle("active", route.view === "logs");
  $("tab-monitor").classList.toggle("active", route.view === "monitor");
  $("logs").hidden = route.view !== "logs";
  $("monitor").hidden = route.view !== "monitor";
  delete $("headactions").dataset.key;
  renderScriptHead();
  resetLog();
  if (route.view === "monitor") {
    monitorData = null;
    loadMonitor();
  }
}

async function refreshScripts() {
  try {
    scripts = (await api("/api/scripts")).scripts;
    showError(null);
  } catch (err) {
    showError("Cannot reach corral: " + (err.message || err));
    return;
  }
  if (route.view === "overview") renderOverview();
  else if (route.view !== "logs" && route.view !== "monitor") return;
  else if (scripts.some((s) => s.name === route.name)) renderScriptHead();
  else location.hash = "#/";   // the script no longer exists
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (route.view === "overview") scripts.forEach((s) => drawOverviewCharts(s.name));
    else if (route.view === "dashboard") redrawPanels();
    else drawMonitor();
  }, 150);
});
window.addEventListener("hashchange", applyRoute);
// The grid also changes width without the window doing so (a scrollbar
// appearing, kiosk mode), and the panels are positioned in pixels.
let gridWidth = 0, gridTimer;
new ResizeObserver(() => {
  const width = $("grid").clientWidth;
  if (!width || width === gridWidth || route.view !== "dashboard" || !dash) return;
  gridWidth = width;
  placePanels();
  clearTimeout(gridTimer);
  gridTimer = setTimeout(redrawPanels, 150);
}).observe($("grid"));

buildMonitor();
loadCatalog().catch(() => {});
refreshScripts().then(applyRoute);
setInterval(refreshScripts, 2000);
setInterval(tail, 1500);
setInterval(() => { refreshOverviewMetrics(); loadMonitor(); }, 10000);
</script>
