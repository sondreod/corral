[project]
name = "demo-project"
version = "0.1.0"
description = "Example project for scriptrunner: two entry points in one package"
requires-python = ">=3.11"
dependencies = ["scriptrunner-metrics"]

[project.scripts]
demo-clock = "demo_project:clock"
demo-greet = "demo_project:greet"

[tool.uv.sources]
scriptrunner-metrics = { path = "../../client" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
