# corral configuration.
# Check it with:    corral --check
# Apply changes:    systemctl reload corral   (apps, processes, .env files)
#                   systemctl restart corral  ([server], [runner] and [metrics])

[server]
# Address of the web interface. There is no authentication, so only change
# the host to something reachable from other machines if you trust the network.
host = "127.0.0.1"
port = 8723
# Host names the web interface answers to, besides localhost and loopback
# addresses. Needed for a reverse proxy that passes on its own host name
# (nginx: proxy_set_header Host $host). Listening on localhost, other names
# are refused, which stops web pages from reaching the interface through DNS
# rebinding. ["*"] answers to any name.
# allowed_hosts = ["corral.example.com"]

[runner]
# Where the log and metrics databases live.
data_dir = "/var/lib/corral"
# Directories put in front of PATH for every process, for programs (such as
# uv) that are not in the service's PATH (/usr/local/bin, /usr/bin, ...).
# path = ["/opt/uv/bin"]
# Log lines kept per process; the oldest are dropped beyond this.
max_log_lines = 100000
# How often CPU, memory, threads and open files of each process are measured
# for the dashboard, and how many days of that history (and of the list of
# runs) are kept.
sample_interval = "10s"
history_days = 7

[metrics]
# How often corral reads its own /metrics page (which includes the processes'
# own metrics) and stores every value, for the graphs on the Dashboards page.
scrape_interval = "1m"
# How long stored values are kept. Each series takes roughly 20 bytes per
# scrape: 30 days at one a minute is under 1 MB per series.
retention = "30d"

# Also push every log line to Grafana Loki, or anything that takes its push
# API (VictoriaLogs, Grafana Cloud), labelled app, process and stream. Lines
# are still kept in SQLite. Needs a restart to change.
#
# [loki]
# url = "http://localhost:9428/insert/loki/api/v1/push"  # VictoriaLogs
# url = "http://localhost:3100/loki/api/v1/push"         # Loki
# labels = { host = "web1" }   # added to every line
# headers = { Authorization = "Bearer ..." }
# batch_wait = "1s"            # how long lines wait to be sent together
# max_buffer = 10000           # lines kept while the server is unreachable

# One table per app: a folder with a Procfile, one process per line:
#
#     web: uv run --script app.py --port 8000
#     worker: uv run --project . myapp-worker
#     mailer: ./mailer.sh
#
# Each line runs with /bin/sh in that folder, as the corral user, and shows
# up as "<app>.<process>" (e.g. shop.web). KEY=value lines in the folder's
# .env file are added to the environment. Examples are in
# /usr/share/doc/corral/examples/. uv keeps its cache in /var/cache/corral;
# `uv run --project` creates .venv in the project folder, so the corral user
# must be able to write there.
#
# [apps.shop]
# dir = "/srv/shop"            # relative paths are relative to this file
# procfile = "Procfile"        # the default
# env = { LOG_LEVEL = "info" } # for every process; wins over .env
# restart_delay = 2            # seconds; doubles after each quick exit...
# max_restart_delay = 60       # ...up to this
# stop_timeout = 10            # seconds between SIGTERM and SIGKILL
# enabled = true               # false: only started from the web interface
#
# Every process is a long-running service, restarted whenever it exits.
# Processes accept the same settings as the app, which they override:
#
# [apps.shop.processes.worker]
# env = { QUEUE = "default" }
# stop_timeout = 60
